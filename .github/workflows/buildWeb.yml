name: CI - ASP.NET Core MVC

env:
  # Path to the web project
  web_project_path: CiteWise_Web/CiteWise_Web.csproj
  # Friendly name for artifacts
  site_name: CiteWise_Web

on:
  push:
    branches: [ "main_web" ]
  pull_request:
    branches: [ "main_web" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Set Current Date As Env Variable
      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Set Repository Name As Env Variable
      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      # Setup .NET 9 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Restore solution (uses .sln file at root)
      - name: Restore dependencies
        run: dotnet restore CiteWise_Web.sln

      # Build solution in Release
      - name: Build
        run: dotnet build CiteWise_Web.sln --configuration Release --no-restore

      # Run tests (if you add a test project)
      - name: Test
        run: dotnet test CiteWise_Web.sln --configuration Release --no-build --verbosity normal

      # Publish the web project
      - name: Publish Web App
        run: |
          PUBLISH_DIR="./publish"
          dotnet publish "$WEB_PROJECT_PATH" --configuration Release --output "$PUBLISH_DIR" --no-build
        env:
          WEB_PROJECT_PATH: ${{ env.web_project_path }}

      # Upload published app as artifact
      - name: Upload Published Site
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }} - ${{ env.site_name }} - ${{ env.repository_name }} - Web publish
          path: publish/

