version: 2.1

orbs:
  node: circleci/node@5.1.0

executors:
  node_20:
    docker:
      - image: cimg/node:20.17
    environment:
      NODE_ENV: test

commands:
  install_backend_deps:
    steps:
      - restore_cache:
          keys:
            - v2-backend-deps-{{ arch }}-{{ .Branch }}-{{ checksum "backend/package-lock.json" }}
            - v2-backend-deps-{{ arch }}-{{ .Branch }}
            - v2-backend-deps-{{ arch }}
      - run:
          name: Install deps in backend/
          working_directory: backend
          command: |
            npm install
      - save_cache:
          key: v2-backend-deps-{{ arch }}-{{ .Branch }}-{{ checksum "backend/package-lock.json" }}
          paths:
            - ~/.npm
            - ~/project/backend/node_modules

jobs:
  lint:
    executor: node_20
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Sanity list
          command: |
            pwd
            ls -la
            echo "---- backend ----"
            ls -la backend
      - install_backend_deps
      - run:
          name: Lint (if script exists)
          working_directory: backend
          command: |
            if npm run | grep -q " lint"; then
              npm run lint
            else
              echo "No lint script; skipping."
            fi

  test:
    executor: node_20
    working_directory: ~/project
    steps:
      - checkout
      - install_backend_deps
      - run:
          name: Unit tests (if script exists)
          working_directory: backend
          command: |
            if npm run | grep -q " test"; then
              npm test -- --ci --reporters=default || npm test
            else
              echo "No test script; skipping."
            fi
      - store_test_results:
          path: backend/test-results
          when: always
      - store_artifacts:
          path: backend/coverage
          when: always

  integration:
    executor: node_20
    working_directory: ~/project
    steps:
      - checkout
      - install_backend_deps
      - run:
          name: Start API (background) + log to file
          working_directory: backend
          command: |
            export PORT="${PORT:-8081}"
            export SKIP_STORAGE_INIT=1     # ← skip external storage checks in CI

            # If your code requires Firebase vars at import time, stub minimal dummies.
            # Prefer setting real secrets in CircleCI project settings for true integration.
            if [ -z "${FIREBASE_PROJECT_ID:-}" ]; then
              export FIREBASE_PROJECT_ID=dummy
            fi
            if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
              export FIREBASE_SERVICE_ACCOUNT_JSON='{"type":"service_account","project_id":"dummy","private_key_id":"x","private_key":"-----BEGIN PRIVATE KEY-----\\nMIIBdummy\\n-----END PRIVATE KEY-----\\n","client_email":"dummy@dummy.iam.gserviceaccount.com","client_id":"0","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_x509_cert_url":"https://www.googleapis.com/robot/v1/metadata/x509/dummy"}'
            fi

            # Start the dev server and tee logs
            npm run dev 2>&1 | tee server.log & echo $! > server.pid
      - run:
          name: Wait for health (HTTP 200)
          working_directory: backend
          command: |
            export PORT="${PORT:-8081}"
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${PORT}/" || true)
              if [ "$code" = "200" ]; then
                echo "Server healthy (HTTP 200)"
                exit 0
              fi
              sleep 1
            done
            echo "Server did not become healthy in time"
            echo "----- server.log (tail) -----"
            tail -n 200 server.log || true
            exit 1
      - run:
          name: Health check (store response)
          command: |
            curl -fsS "http://localhost:${PORT:-8081}/" | tee /tmp/health.txt
      - run:
          name: Stop API
          working_directory: backend
          command: |
            if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi
      - store_artifacts:
          path: /tmp/health.txt
      - store_artifacts:
          path: backend/server.log

workflows:
  version: 2
  ci_only:
    jobs:
      - lint
      - test:
          requires: [lint]
      - integration:
          requires: [test]
