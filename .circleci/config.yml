version: 2.1

orbs:
  node: circleci/node@5.1.0

executors:
  node_20:
    docker:
      - image: cimg/node:20.17
    environment:
      NODE_ENV: test

commands:
  install_backend_deps:
    steps:
      - restore_cache:
          keys:
            - v2-backend-deps-{{ arch }}-{{ .Branch }}-{{ checksum "backend/package-lock.json" }}
            - v2-backend-deps-{{ arch }}-{{ .Branch }}
            - v2-backend-deps-{{ arch }}
      - run:
          name: Install deps in backend/
          working_directory: backend
          command: |
            npm install
      - save_cache:
          key: v2-backend-deps-{{ arch }}-{{ .Branch }}-{{ checksum "backend/package-lock.json" }}
          paths:
            - ~/.npm
            - ~/project/backend/node_modules

jobs:
  lint:
    executor: node_20
    working_directory: ~/project   # checkout repo at root
    steps:
      - checkout
      - run:
          name: Sanity list
          command: |
            pwd
            ls -la
            echo "---- backend ----"
            ls -la backend
      - install_backend_deps
      - run:
          name: Lint (if script exists)
          working_directory: backend
          command: |
            if npm run | grep -q " lint"; then
              npm run lint
            else
              echo "No lint script; skipping."
            fi

  test:
    executor: node_20
    working_directory: ~/project
    steps:
      - checkout
      - install_backend_deps
      - run:
          name: Unit tests (if script exists)
          working_directory: backend
          command: |
            if npm run | grep -q " test"; then
              npm test -- --ci --reporters=default || npm test
            else
              echo "No test script; skipping."
            fi
      - store_test_results:
          path: backend/test-results
          when: always
      - store_artifacts:
          path: backend/coverage
          when: always

  integration:
    executor: node_20
    working_directory: ~/project
    steps:
      - checkout
      - install_backend_deps
      - run:
          name: Start API (npm run dev) in background
          working_directory: backend
          command: |
            export PORT="${PORT:-8081}"
            npm run dev & echo $! > server.pid

            # wait for port
            for i in $(seq 1 60); do
              sleep 1
              nc -z localhost "$PORT" && echo "Server up on $PORT" && break
              [ "$i" -eq 60 ] && echo "Server did not start" && exit 1
            done
      - run:
          name: Health check
          command: |
            curl -fsS "http://localhost:${PORT:-8081}/" | tee /tmp/health.txt
      - run:
          name: Stop API
          working_directory: backend
          command: |
            kill "$(cat server.pid)" || true
      - store_artifacts:
          path: /tmp/health.txt

workflows:
  version: 2
  ci_only:
    jobs:
      - lint
      - test:
          requires: [lint]
      - integration:
          requires: [test]
